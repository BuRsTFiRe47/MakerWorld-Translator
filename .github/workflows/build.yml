# TR: "v*" etiketi (v2.0.0 gibi) push edilince: önce testler çalışır, sonra
#     Windows ve Apple Silicon macOS derlenir, zip'lenir ve otomatik olarak
#     bir GitHub Release oluşturulup zip'ler eklenir.
# EN: On a "v*" tag push (e.g. v2.0.0): tests run first, then Windows and
#     Apple Silicon macOS are built, zipped, and a GitHub Release is created
#     automatically with the zips attached.

name: Build Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # gerekli / required to create a Release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build .exe
        run: pyinstaller --noconfirm --onedir --windowed --name "MakerWorldTranslator" main.py
      - name: Zip build
        run: Compress-Archive -Path dist/MakerWorldTranslator/* -DestinationPath MakerWorldTranslator-Windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakerWorldTranslator-Windows
          path: MakerWorldTranslator-Windows.zip

  build-macos-arm64:
    needs: test
    runs-on: macos-14  # Apple Silicon (M1/M2/M3/M4) runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build .app
        run: pyinstaller --noconfirm --onedir --windowed --name "MakerWorldTranslator" main.py
      - name: Zip build
        run: ditto -c -k --sequesterRsrc --keepParent dist/MakerWorldTranslator.app MakerWorldTranslator-macOS-AppleSilicon.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakerWorldTranslator-macOS-AppleSilicon
          path: MakerWorldTranslator-macOS-AppleSilicon.zip

  # TR: Sadece etiket push'unda çalışır; manuel tetiklemede release oluşturmaz.
  # EN: Runs only on a tag push; manual runs build but don't create a release.
  release:
    needs: [build-windows, build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MakerWorldTranslator-Windows/MakerWorldTranslator-Windows.zip
            artifacts/MakerWorldTranslator-macOS-AppleSilicon/MakerWorldTranslator-macOS-AppleSilicon.zip
          generate_release_notes: true

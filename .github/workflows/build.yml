# TR: Bu workflow bir "v*" etiketi (v1.0.0 gibi) push edildiğinde tetiklenir.
#     Windows ve Apple Silicon macOS için derleme yapar, ikisini de zip'ler
#     ve otomatik olarak bir GitHub Release oluşturup bu zip'leri ekler.
# EN: This workflow triggers on a "v*" tag push (e.g. v1.0.0). It builds
#     for Windows and Apple Silicon macOS, zips both, and automatically
#     creates a GitHub Release with those zips attached.

name: Build Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # gerekli / required to create a Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build .exe
        run: pyinstaller --noconfirm --onedir --windowed --name "MakerWorldTranslator" main.py
      - name: Zip build
        run: Compress-Archive -Path dist/MakerWorldTranslator/* -DestinationPath MakerWorldTranslator-Windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakerWorldTranslator-Windows
          path: MakerWorldTranslator-Windows.zip

  build-macos-arm64:
    runs-on: macos-14  # Apple Silicon (M1/M2/M3) runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build .app
        run: pyinstaller --noconfirm --onedir --windowed --name "MakerWorldTranslator" main.py
      - name: Zip build
        run: ditto -c -k --sequesterRsrc --keepParent dist/MakerWorldTranslator.app MakerWorldTranslator-macOS-AppleSilicon.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakerWorldTranslator-macOS-AppleSilicon
          path: MakerWorldTranslator-macOS-AppleSilicon.zip

  # TR: Sadece bir etiket (tag) push edildiğinde çalışır — manuel
  #     tetiklemede (workflow_dispatch) release oluşturmaz, sadece derler.
  # EN: Only runs when a tag is pushed — manual triggers (workflow_dispatch)
  #     just build, they don't create a release.
  release:
    needs: [build-windows, build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/MakerWorldTranslator-Windows/MakerWorldTranslator-Windows.zip
            artifacts/MakerWorldTranslator-macOS-AppleSilicon/MakerWorldTranslator-macOS-AppleSilicon.zip
          generate_release_notes: true
